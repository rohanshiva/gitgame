limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=webapp_zone:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=websocket_zone:10m rate=5r/s;

server {
    server_name gitgame.live;
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://localhost:8001/;
    }

    location /socket/ {
        limit_req zone=websocket_zone burst=5 nodelay;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://localhost:8001/socket/;
    }

    location / {
        limit_req zone=webapp_zone burst=50 nodelay;
        proxy_pass http://localhost:3000/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gitgame.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gitgame.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = gitgame.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name gitgame.live;
    return 404; # managed by Certbot
}